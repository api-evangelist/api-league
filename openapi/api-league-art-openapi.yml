      parameters:
      - name: url
        description: The URL to the image.
        schema:
          pattern: .
          maxLength: 1000
          type: string
          example: https://upload.wikimedia.org/wikipedia/commons/3/35/Basic_human_drawing.png
        required: true
        style: form
        explode: false
        in: query
      - name: width
        description: The maximum width of the image (default 400, max. 500).
        schema:
          format: int32
          minimum: 1
          maximum: 500
          type: integer
          example: 200
        required: false
        style: form
        explode: false
        in: query
      - name: height
        description: The maximum height of the image (default 400, max. 500).

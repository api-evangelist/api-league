                          name: mushrooms
                          image: https://spoonacular.com/cdn/ingredients_100x100/mushrooms.png
                        - id: 1015006
                          name: chicken
                          image: https://spoonacular.com/cdn/ingredients_100x100/whole-chicken.jpg

      parameters:
      - name: ingredients
        description: A comma-separated list of the ingredients of the recipe.
        schema:
          pattern: .
          maxLength: 1000
          type: string
          example: 1 cup apples,3oz milk,35g butter
        required: true
        style: form
        explode: false
        in: query
      - name: servings
        description: The number of servings the ingredients make. Nutrition is computed per serving.
        schema:
          format: int32
          minimum: 1
          maximum: 999
          type: integer
          example: 1
        required: false
        style: form
        explode: false
        in: query
      - name: reduce-oils
        description: If there is oil in the ingredients, e.g. 3 tablespoons olive oil but they are used
          for frying, not all of the oil is consumed and therefore should not be added to the computed
          nutrition. In this case set reduce-oils to true.
        schema:
          type: boolean
          example: true
        required: false
        style: form
        explode: false
        in: query
      externalDocs:
        description: Read entire docs
        url: https://apileague.com/apis/compute-nutrition-api/
      summary: Compute Nutrition API
      tags:
      - Food
      description: Compute detailed nutritional information for a given recipe (list of ingredients).
        The API will return the nutritional information for each ingredient, as well as the total nutritional
        content for the entire recipe. Aside from macro and micro nutrients, the API also returns flavanoid
        information and food properties such as glycemic index, glycemic load, and inflammation score.
      operationId: computeNutritionAPI
      deprecated: false

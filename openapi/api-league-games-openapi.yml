      description: Search through a vast database of over half a million video games from more than 50
        platforms. This API allows you to find games based on various criteria such as genre, platform,
        release date, and more. The results include detailed information about each game, including ratings,
        descriptions, and images.
      operationId: searchGamesAPI
      deprecated: false

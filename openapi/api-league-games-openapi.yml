      parameters:
      - name: query
        description: The search query.
        schema:
          pattern: .
          maxLength: 100
          type: string
          example: strategy games
        required: false
        style: form
        explode: false
        in: query
      - name: offset
        description: Pagination offset (start index) between 0 and 1000.
        schema:
          format: int32
          minimum: 0
          maximum: 1000
          type: integer
          example: 0
        required: false
        style: form
        explode: false
        in: query
      - name: limit
        description: Number of results to return between 1 and 100.
        schema:
          format: int32
          minimum: 1
          maximum: 100
          type: integer
          example: 10
        required: false
        style: form
        explode: false
        in: query
      - name: filters
        description: JSON array of filters
        schema:
          pattern: .
          maxLength: 10000
          type: string
          example: '[]'
        required: false
        style: form
        explode: false
        in: query
      - name: sort
        description: Field to sort by
        schema:
          pattern: .
          maxLength: 50
          type: string
          example: rating
        required: false
        style: form
        explode: false
        in: query
      - name: sort-order
        description: Sort order (asc or desc)
        schema:
          pattern: .
          maxLength: 4
          type: string
          example: asc
        required: false
        style: form
        explode: false
        in: query
      - name: generate-filter-options
        description: Whether to generate filter options
        schema:
          type: boolean
          example: true
        required: false
        style: form
        explode: false
        in: query
      externalDocs:

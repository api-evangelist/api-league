      parameters:
      - name: source-country
        description: The ISO 3166 country code of the country for which top news should be retrieved.
        schema:
          pattern: .
          maxLength: 2
          type: string
          example: us
        required: true
        style: form
        explode: false
        in: query
      - name: language
        description: The ISO 6391 language code of the top news. The language must be one spoken in the
          source-country.
        schema:
          pattern: .
          maxLength: 2
          type: string
          example: en
        required: true
        style: form
        explode: false
        in: query
      - name: date
        description: The date for which the top news should be retrieved. If no date is given, the current
          day is assumed.
        schema:
          pattern: .
          maxLength: 10
          type: string
          example: '2024-05-30'
        required: false
        style: form
        explode: false
        in: query
      - name: headlines-only
        description: Whether to only return basic information such as id, title, and url of the news.
        schema:
          type: boolean
          example: false
        required: false
        style: form
        explode: false
        in: query
      externalDocs:
        description: Read entire docs
        url: https://apileague.com/apis/top-news-api/
      summary: Top News API
      tags:
      - News
      description: Get the top news from a country (over 220 are supported) in a language (over 90 are
        supported) for a specific date. The top news are clustered from multiple sources in the given
        country. The more news in a cluster the higher the cluster is ranked.
      operationId: topNewsAPI
      deprecated: false

openapi: 3.0.0
info:
  title: API League — News
  description: API League is a Hub for World Class APIs.
  version: 1.9.0
  termsOfService: https://apileague.com/terms
  contact:
    name: David Urbansky
    email: mail@apileague.com
servers:
- url: https://api.apileague.com
tags:
- name: News
security:
- apiKey: []
- headerApiKey: []
paths:
  /search-news:
    get:
      responses:
        '200':
          description: Success
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  offset:
                    type: integer
                  number:
                    type: integer
                  available:
                    type: integer
                  news:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        title:
                          type: string
                          nullable: true
                        text:
                          type: string
                          nullable: true
                        summary:
                          type: string
                          nullable: true
                        url:
                          type: string
                          nullable: true
                        image:
                          type: string
                          nullable: true
                        video:
                          type: string
                          nullable: true
                        publish_date:
                          type: string
                          nullable: true
                        authors:
                          type: array
                          items:
                            type: string
                            nullable: true
                        category:
                          type: string
                          nullable: true
                        language:
                          type: string
                          nullable: true
                        source_country:
                          type: string
                          nullable: true
                        sentiment:
                          type: number
              examples:
                Response:
                  value:
                    offset: 0
                    number: 10
                    available: 83
                    news:
                    - id: 28
                      title: Tesla to Release a Four-Motor Version of Cybertruck
                      text: 'Tesla CEO Elon Musk has revealed new details about the upcoming Cybertruck
                        electric pickup truck, the mass production of which was delayed until 2023 because
                        of the lack of components and a lot of complex technologies that need to be scaled
                        up. According to Musk, the initial production of the electric pickup truck will
                        begin with a four-motor variant with “independent, ultra fast response torque
                        control of each wheel,” the tweet reads. In response, Twitter users asked if the
                        Cybertruck could turn like a tank. Musk said that thanks to both the rear and
                        front wheel steer, the electric truck will not only be able to turn like a tank,
                        but also drive diagonally like a crab. According to Electrek, this change could
                        be Tesla''s reaction to what its competitors do. Since the introduction of Tesla’s
                        novelty, the market for electric pickup trucks has significantly evolved. Currently,
                        one electric pickup on the market can turn like a tank – the Rivian R1T, while
                        GMC''s Hummer EV can drive diagonally. Following the announcement of Tesla Cybertruck
                        in 2019, the company announced three configurations of the pickup truck: the entry-level
                        model with one motor, the one with two motors, and the one with three. Rumor has
                        it that the company intends to abandon the single-motor version altogether. In
                        this case, Tesla Cybertruck will be sold with two, three, and four motors. Musk
                        has promised to provide an update on the pickup''s roadmap on the next earnings
                        call. The production of Tesla Cybertruck is expected to begin at the end of 2022,
                        and its mass production is slated to start in 2023.'
                      summary: Tesla CEO Elon Musk has revealed new details about the upcoming Cybertruck
                        electric pickup truck. According to Musk, its initial production will begin with
                        a four-motor variant.
                      url: https://internetprotocol.co/hitech/2021/12/07/tesla-to-release-a-four-motor-cybertruck/
                      image: https://internetprotocol.co/content/images/2021/12/Tesla-to-Release-a-Four-Motor-Version-of-Cybertruck.png
                      video: https://cdn.jwplayer.com/videos/70lDQJpg-RyIcpnTz.mp4
                      publish_date: '2022-09-30 01:07:48'
                      authors:
                      - Iwan Stone
                      - Zahna Eklund
                      category: business
                      language: en
                      source_country: co
                      sentiment: 0.712523
        '401':
          description: Unauthorized
        '402':
          description: Payment Required
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '406':
          description: Not Acceptable
        '429':
          description: Too Many Requests
      parameters:
      - name: text
        description: The text to match in the news content (at least 3 characters, maximum 100 characters).
          By default all query terms are expected, you can use an uppercase OR to search for any terms,
          e.g. tesla OR ford. You can also exclude terms by putting a minus sign (-) in front of the term,
          e.g. tesla -ford.
        schema:
          pattern: .
          maxLength: 100
          type: string
          example: tesla
        required: false
        style: form
        explode: false
        in: query
      - name: source-countries
        description: A comma-separated list of ISO 3166 country codes from which the news should originate.
        schema:
          pattern: .
          maxLength: 100
          type: string
          example: us,uk
        required: false
        style: form
        explode: false
        in: query
      - name: language
        description: The ISO 6391 language code of the news.
        schema:
          pattern: .
          maxLength: 2
          type: string
          example: en
        required: false
        style: form
        explode: false
        in: query
      - name: min-sentiment
        description: The minimal sentiment of the news in range [-1,1].
        schema:
          format: double
          minimum: -1
          maximum: 1
          type: number
          example: -0.8
        required: false
        style: form
        explode: false
        in: query
      - name: max-sentiment
        description: The maximal sentiment of the news in range [-1,1].
        schema:
          format: double
          minimum: -1
          maximum: 1
          type: number
          example: 0.8
        required: false
        style: form
        explode: false
        in: query
      - name: earliest-publish-date
        description: The news must have been published after this date.
        schema:
          pattern: .
          maxLength: 100
          type: string
          example: '2022-04-22 16:12:35'
        required: false
        style: form
        explode: false
        in: query
      - name: latest-publish-date
        description: The news must have been published before this date.
        schema:
          pattern: .
          maxLength: 100
          type: string
          example: '2022-04-22 16:12:35'
        required: false
        style: form
        explode: false
        in: query
      - name: news-sources
        description: A comma-separated list of news sources from which the news should originate.
        schema:
          pattern: .
          maxLength: 10000
          type: string
          example: https://www.bbc.co.uk
        required: false
        style: form
        explode: false
        in: query
      - name: authors
        description: A comma-separated list of author names. Only news from any of the given authors will
          be returned.
        schema:
          pattern: .
          maxLength: 300
          type: string
          example: John Doe
        required: false
        style: form
        explode: false
        in: query
      - name: categories
        description: A comma-separated list of categories. Only news from any of the given categories
          will be returned. Possible categories are politics, sports, business, technology, entertainment,
          health, science, lifestyle, travel, culture, education, environment, other.
        schema:
          pattern: .
          maxLength: 300
          type: string
          example: politics,sports
        required: false
        style: form
        explode: false
        in: query
      - name: entities
        description: Filter news by entities (ORG, PER, or LOC).
        schema:
          pattern: .
          maxLength: 10000
          type: string
          example: ORG:Tesla
        required: false
        style: form
        explode: false
        in: query
      - name: location-filter
        description: Filter news by radius around a certain location. Format is "latitude,longitude,radius
          in kilometers"
        schema:
          pattern: .
          maxLength: 100
          type: string
          example: 51.050407, 13.737262, 100
        required: false
        style: form
        explode: false
        in: query
      - name: sort
        description: The sorting criteria (publish-time).
        schema:
          pattern: .
          maxLength: 100
          type: string
          example: publish-time
        required: false
        style: form
        explode: false
        in: query
      - name: sort-direction
        description: Whether to sort ascending or descending (ASC or DESC).
        schema:
          pattern: .
          maxLength: 4
          type: string
          example: ASC
        required: false
        style: form
        explode: false
        in: query
      - name: offset
        description: The number of news to skip in range [0,10000]
        schema:
          format: int32
          minimum: 0
          maximum: 10000
          type: integer
          example: 0
        required: false
        style: form
        explode: false
        in: query
      - name: number
        description: The number of news to return in range [1,100]
        schema:
          format: int32
          minimum: 1
          maximum: 100
          type: integer
          example: 10
        required: false
        style: form
        explode: false
        in: query
      externalDocs:
        description: Read entire docs
        url: https://apileague.com/apis/search-news-api/
      summary: Search News API
      tags:
      - News
      description: Search and filter millions of news from over 200 countries in 90 languages by text,
        date, location, category, language, and more. The API returns a list of news articles matching
        the given criteria. You can set as many filtering parameters as you like, but you have to set
        at least one, e.g. text or language.
      operationId: searchNewsAPI
      deprecated: false

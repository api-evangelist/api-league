provider: API League
providerId: api-league
description: >-
  API League runs a real status page and states a 99.9% uptime target on every plan including
  the free one, but publishes no versioning policy, no deprecation policy and no changelog. The
  contract is unversioned in transport and the terms explicitly reserve the right to withdraw
  it without notice, so there is no notice period a consumer can plan against.
versioning:
  scheme: none-in-transport
  current: '1.9.0'
  docs: null
  detail: >-
    The base URL https://api.apileague.com/ carries no version segment and no version header or
    parameter exists. `1.9.0` is the OpenAPI `info.version` and the generated SDK version; it is
    a build number for the description document, not something a caller can pin a request to.
  version_history_source: https://registry.npmjs.org/apileague-js
deprecation:
  policy_url: null
  policy_published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  note: >-
    No deprecation policy exists. No `Sunset` or `Deprecation` response header is documented,
    and no operation in the OpenAPI is marked `deprecated: true`. The terms of use go the other
    way and say so plainly: "We reserve the right to discontinue the API League or to withdraw
    your permission to use the API League at any time for any reason without notice." NO
    `Deprecation` pointer is emitted in apis.yml — there is no policy to point at.
sla:
  url: https://apileague.com/pricing/
  uptime_target: 99.9%
  applies_to: all plans including Free
  support_tiers:
    - {plan: Free, support: Discord only}
    - {plan: Rookie, support: Discord only}
    - {plan: Pro, support: Email}
    - {plan: Champion, support: Scheduled phone}
  contractual: false
  note: >-
    The 99.9% figure is published on the pricing page and restated in the pricing FAQ ("We
    guarantee 99.9% uptime for all plans"). It is a marketing commitment, not a credit-backed
    SLA — the terms of use disclaim all warranties and state the service is provided "as is",
    "with all faults" and "as available", with no service credits defined anywhere.

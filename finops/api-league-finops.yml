description: FinOps framework definition for the API League API surface. Provides a FOCUS-aligned mapping
  for cost allocation, usage measurement, and unit-economics reporting across the provider's APIs.
principles:
  - name: Visibility
    description: Make API consumption costs visible to engineering, product, and finance teams in near
      real-time.
  - name: Allocation
    description: Tag every chargeable API call with the consuming team, environment, application, and
      feature so cost can be allocated.
  - name: Optimization
    description: Continuously evaluate request patterns, caching, batching, and tier selection to reduce
      cost per useful unit of work.
  - name: Accountability
    description: Establish budget owners and chargeback or showback flows for each consuming team.
domains:
  - name: Understand Usage and Cost
    capabilities:
      - Data Ingestion
      - Allocation
      - Reporting and Analytics
      - Anomaly Management
  - name: Quantify Business Value
    capabilities:
      - Planning and Estimating
      - Forecasting
      - Budgeting
      - Benchmarking
      - Unit Economics
  - name: Optimize Usage and Cost
    capabilities:
      - Architecting for Cloud
      - Rate Optimization
      - Workload Optimization
      - Cloud Sustainability
      - Licensing and SaaS
  - name: Manage the FinOps Practice
    capabilities:
      - FinOps Practice Operations
      - FinOps Education and Enablement
      - Invoicing and Chargeback
      - Onboarding Workloads
      - Intersecting Disciplines
billingModel:
  pricingCategory: Usage-Based
  billingFrequency: Monthly
  # 2026-09-02: corrected against https://apileague.com/pricing/ — API League meters in TOKENS
  # per DAY (a per-endpoint cost that also varies with parameters), not in requests. Paid tiers
  # bill per-token overage above the daily allowance; the free tier hard-stops with HTTP 402.
  meteringUnit: token
  quotaPeriod: day
  quotaReset: midnight UTC
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Purchase
    - Tax
    - Credit
    - Adjustment
  chargeFrequency: Recurring
focusColumns:
  ServiceName: API League
  ServiceCategory: Developer Tools / API
  ProviderName: API League
  PublisherName: API League
  InvoiceIssuerName: API League
  PricingCategory: Usage-Based
  PricingUnit: token
  BillingCurrency: USD
  ChargeCategory: Usage
meters:
  - name: api_tokens
    description: Count of billable tokens consumed (the actual billing unit; returned per request in the X-API-Quota-Request response header)
    unit: token
    aggregation: sum
    dimensions:
      - api
      - endpoint
      - tier
      - region
      - consumer
  - name: data_egress
    description: Bytes returned over the network in API responses
    unit: GB
    aggregation: sum
    dimensions:
      - api
      - region
      - consumer
  - name: compute_seconds
    description: Server-side compute consumed by the request, where applicable
    unit: second
    aggregation: sum
    dimensions:
      - api
      - endpoint
      - tier
apis:
  - name: API League Platform
    baseURL: https://api.apileague.com
    tags:
      - API Marketplace
      - Developer Tools
      - Multi-Category
      - SDK
    serviceName: API League Platform
    serviceCategory: API
unitEconomics:
  - name: Cost per 1K Tokens
    metric: billed_cost / (api_tokens / 1000)
    target: 'published overage: $0.006 Rookie / $0.004 Pro / $0.002 Champion per token'
  - name: Cost per Active Consumer
    metric: billed_cost / active_consumers
    target: TBD
maintainers:
  - FN: Kin Lane
    email: info@apievangelist.com

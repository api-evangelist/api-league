aid: api-league
name: API League
description: >-
  API League is a single-key hub of 55 read-only HTTP APIs spanning twelve categories — Books,
  News, Humor, Food, Knowledge, Games, Art, Web, Text, Media, Math and Storage — operated by
  skycraft GmbH of Dresden, Germany, which has been shipping developer APIs since 2015. Every
  operation is an HTTP GET against https://api.apileague.com, authenticated with one API key
  passed as an api-key query parameter or an x-api-key header, and described by a published
  OpenAPI 3.0 contract (v1.9.0) that carries an operationId, a summary, a tag and a worked
  response example on all 55 operations. Billing is metered in tokens per day rather than
  requests per month, and every response returns X-API-Quota-Request, X-API-Quota-Used and
  X-API-Quota-Left so a consumer can read its remaining budget at runtime. Client libraries are
  generated for 21 languages from that contract, though only the JavaScript client is published
  to a package registry. Pricing is fully self-serve across four tiers from a free
  50-token-per-day plan to $199/mo, with a 99.9% uptime target and a public status page.
type: Index

apis:
  - aid: api-league:api-league-platform
    name: API League Platform
    description: >-
      The API League Platform exposes 55 read-only GET operations across twelve categories:
      Books (2), News (3), Humor (6), Food (4), Knowledge (5), Games (3), Art (4), Web (6),
      Text (13), Media (6), Math (1) and Storage (2). One API key covers the whole surface —
      there is no OAuth and no scopes — sent as an api-key query parameter or, preferably, an
      x-api-key header. Errors use a flat vendor JSON envelope with six declared statuses
      (401, 402, 403, 404, 406, 429) rather than RFC 9457. Search-shaped operations paginate
      with number/offset. SDKs are generated for 21 languages from the published OpenAPI 3.0
      contract.

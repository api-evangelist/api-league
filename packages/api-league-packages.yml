method: searched
source: >-
  https://apileague.com/sdks/ (the provider's own SDK page), the linked first-party client
  monorepo github.com/ddsky/api-league-clients, and registry metadata sweeps of
  registry.npmjs.org, pypi.org, rubygems.org, repo.packagist.org, crates.io,
  search.maven.org, azuresearch-usnc.nuget.org and proxy.golang.org.
provider: API League
providerId: api-league
description: >-
  API League generates client libraries for 21 languages with OpenAPI Generator and ships them
  from ONE monorepo — github.com/ddsky/api-league-clients — as source trees plus per-language
  zip downloads linked from https://apileague.com/sdks/. The distribution finding is the
  important one: only ONE of the 21 is actually published to a package registry. Every other
  language is git-clone-or-download-a-zip, which means `npm install` / `pip install` /
  `go get` do not reach them and a consumer cannot pin, diff, or receive a version of them.
summary:
  languages_generated: 21
  registry_published_count: 1
  registry_absent_count: 20
  first_party_sdk_count: 1
  generator: OpenAPI Generator (openapi-generator-cli 7.5.0 / 7.8.0-SNAPSHOT, vendored in the repo)
  monorepo: https://github.com/ddsky/api-league-clients
  monorepo_license: MIT
  monorepo_last_push: '2025-12-09'
  note: >-
    SDK version 1.9.0 tracks OpenAPI `info.version` 1.9.0 exactly, and the npm publish date
    (2025-12-09) matches the monorepo's last push to the hour — the clients are regenerated
    with the spec rather than drifting behind it. That is the opposite of the usual
    abandonment signal, and it is the reason the registry gap is a distribution problem
    rather than a maintenance one.

github_organization:

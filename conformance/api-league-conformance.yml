domain_standard:
  applicable: false
  note: >-
    REWARD-ONLY, and correctly empty here. API League is a general-purpose multi-category
    utility marketplace — books, news, humor, food, text NLP, media, web, games. There is no
    single vertical standard that governs that mix, so there is no domain standard for the
    contract to declare and none has been invented to fill the slot. Checked specifically for
    the shapes worth checking against this surface and found NONE of them: no SCIM schema URNs,
    no OData $metadata, no OpenRTB, no ActivityPub actor, no OAI-PMH verbs, no ORCID/DataCite/
    Crossref identifier scheme on the books or art endpoints, no schema.org/JSON-LD typing in
    responses, no IPTC/NewsML vocabulary on the news endpoints, no FDC/USDA nutrient identifiers
    on the nutrition endpoints. The Books endpoints do surface Open Library cover URLs
    (covers.openlibrary.org) in their examples, which is a data-source lineage signal, not a
    conformance claim.
  candidates_checked: [scim2, odata, openrtb, activitypub, oai-pmh, orcid, datacite, crossref, schema-org, iptc-newsml, usda-fdc]
compliance_program:
  published: false
  trust_center: false
  certifications: []
  bug_bounty: false
  security_page: false
  note: >-
    Probed and absent: https://apileague.com/security/ returns the catch-all homepage, no
    security.txt on any host, and probe-security-programs.py found neither a vulnerability
    disclosure program nor a trust center. The operating company is skycraft GmbH of Dresden,
    Germany (https://apileague.com/about), and the terms of use place jurisdiction in Dresden —
    so the service sits inside the EU/GDPR regime by establishment. That is a legal fact about
    where the company is, NOT a published compliance certification, and it is recorded here
    rather than as a Compliance pointer for exactly that reason.
  privacy_disclosure:
    url: https://apileague.com/terms/
    note: >-
      A Privacy Policy is published as a section of the combined Terms and Privacy page. It
      names Plausible Analytics as the analytics processor and describes cookie use. There is
      no separate /privacy page — that path returns the catch-all homepage.

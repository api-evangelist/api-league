description: >-
  Cross-cutting standards conformance for API League, derived from the contract itself rather
  than from marketing claims. The provider makes NO compliance claims of any kind — there is no
  trust center, no certification badge, no SOC 2 / ISO 27001 / PCI / HIPAA reference, and no
  security or responsible-disclosure page. No `Compliance` pointer is emitted in apis.yml, and
  no `Security` pointer either: both would assert a published program that does not exist.

description: >-
  NO .well-known document is served on any API League host. Neither host can serve one, and
  each fails in a different way that is worth recording separately.

  apileague.com is a CATCH-ALL: every unknown path returns HTTP 200 with the identical
  21,974-byte homepage HTML. That is the same body the site root returns, and the same body a
  guaranteed-nonexistent control path returns, so a 200 on this host carries no information at
  all. It is also why the pre-existing llms/api-league-llms-probe.yml recorded /llms.txt as a
  soft-404 rather than a published document.

  api.apileague.com sits behind a blanket API-key wall: EVERY path, including the control,
  returns HTTP 401 with the body {"status":"failure","code":401,"message":"Please read
  https://apileague.com/docs/authentication"}. A 401 is not a document either, and it must not
  be read as evidence that a document exists behind it.

  NO WellKnown and NO SecurityTxt pointer is emitted for this provider. Nothing here is a hit.
